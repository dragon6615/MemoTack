# 推送 v*.*.* 格式的 tag 時，自動建置安裝程式並發佈 GitHub Release
# 用法：先在 CHANGELOG.md 寫好該版本的段落，再 git tag v1.1.0 && git push origin v1.1.0
# Release 說明取自 CHANGELOG.md；找不到該版本的段落會在建置前中止
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # 建立 Release 需要寫入權限

jobs:
  build-and-release:
    runs-on: windows-latest # 內建 .NET SDK 與 Inno Setup 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag # v1.2.3 -> 1.2.3
        id: ver
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md # 放在建置前：沒寫更新說明就不浪費時間建置
        shell: pwsh
        run: .\.github\release-notes.ps1 -Version ${{ steps.ver.outputs.version }} -OutFile release-notes.md

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MemoTack v${{ steps.ver.outputs.version }}
          files: installer/MemoTack-Setup-${{ steps.ver.outputs.version }}.exe
          body_path: release-notes.md # 給使用者看的更新說明（取自 CHANGELOG.md）
